[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strata-check"
version = "0.0.1"
description = "Score your data on the STRATA dimensions (Sourced, Traceable, Retrievable, Aligned, Timely, Audited) before AI agents and RAG systems use it"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amrutha Satishkumar" }]
dependencies = ["pandas>=2.0", "pyyaml>=6.0"]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
fabric = ["deltalake>=0.18", "pyarrow>=14"]
dev = ["pytest>=8"]

[project.scripts]
strata-check = "strata_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
